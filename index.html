<html lang="id">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Ujian Aman - Noor Irfan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Mencegah seleksi teks (copy) */
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animasi Pop-up */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-popup {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-black via-gray-900 to-blue-950 text-gray-100 min-h-screen font-sans p-4 flex flex-col items-center">

    <header class="w-full max-w-7xl flex items-center justify-between py-4 px-6 glass-panel rounded-full shadow-lg mb-12">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-500 to-blue-600 flex items-center justify-center font-bold text-white text-xl">S</div>
            <h1 class="text-2xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-blue-500">
                Sumatif By NOOR IRFAN
            </h1>
        </div>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-400">
            <span class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full font-bold">Portal PKn Spensev</span>
        </nav>
    </header>

    <main class="w-full max-w-lg flex-grow flex items-center justify-center">
        <div class="w-full p-8 rounded-3xl glass-panel shadow-2xl border border-blue-900/50">
            <div class="text-center mb-10">
                <p class="text-xs uppercase tracking-widest text-blue-400 font-semibold mb-1">Web Exam Shield v1.2</p>
                <h2 class="text-4xl font-bold text-white tracking-tight">Mulai Ujian</h2>
                <p class="text-gray-400 mt-2">Pastikan data yang Anda masukkan benar.</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label for="gformUrl" class="block text-sm font-medium text-gray-300 mb-2">1. LINK GOOGLE FORM</label>
                    <input type="url" id="gformUrl" placeholder="https://docs.google.com/forms/..." 
                        class="w-full px-5 py-3.5 bg-gray-900 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-white placeholder-gray-600">
                </div>

                <div>
                    <label for="examToken" class="block text-sm font-medium text-gray-300 mb-2">2. TOKEN MASUK UJIAN</label>
                    <input type="text" id="examToken" placeholder="MASUKKAN TOKEN DARI PENGAWAS" 
                        class="w-full px-5 py-3.5 bg-gray-900 border border-gray-700 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 transition text-white placeholder-gray-600 uppercase font-mono tracking-wider">
                </div>

                <button onclick="checkFieldsAndProceed()" class="w-full py-4 bg-blue-700 hover:bg-blue-600 rounded-xl text-lg font-bold text-white transition duration-200 transform hover:scale-[1.02] shadow-lg shadow-blue-900/30">
                    Mulai Ujian Aman
                </button>

                <div class="relative py-2 flex items-center">
                    <div class="flex-grow border-t border-gray-700"></div>
                    <span class="flex-shrink mx-4 text-xs text-gray-600 uppercase font-bold tracking-wider">ATAU SCAN QR SOAL</span>
                    <div class="flex-grow border-t border-gray-700"></div>
                </div>

                <button onclick="openScanner()" class="w-full py-3.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-xl text-gray-300 flex items-center justify-center gap-3 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Buka Kamera Scan QR
                </button>

                <div id="scanner-container" class="hidden border border-gray-700 rounded-2xl overflow-hidden bg-black p-4 space-y-4">
                    <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
                    
                    <div class="flex gap-2 justify-center">
                        <button onclick="switchCamera('environment')" id="btn-cam-back" class="flex-1 py-2 px-3 bg-blue-600 text-xs font-bold text-white rounded-lg transition active:scale-95 flex items-center justify-center gap-1">
                            📷 Kamera Belakang (Utama)
                        </button>
                        <button onclick="switchCamera('user')" id="btn-cam-front" class="flex-1 py-2 px-3 bg-gray-800 text-xs font-semibold text-gray-300 rounded-lg transition active:scale-95 flex items-center justify-center gap-1">
                            🤳 Kamera Depan (Selfie)
                        </button>
                    </div>
                    
                    <button onclick="closeScanner()" class="w-full bg-gray-900 text-xs py-2 rounded-xl text-gray-400 border border-gray-800 hover:bg-gray-800">Tutup Kamera</button>
                </div>

            </div>
        </div>
    </main>

    <div id="customPopupOverlay" class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-gray-900 w-full max-w-sm rounded-3xl p-7 border-2 border-amber-500 shadow-2xl shadow-amber-900/30 animate-popup">
            <div class="mb-5 flex justify-center">
                <span class="inline-flex items-center px-4 py-1.5 rounded-full bg-amber-950 border border-amber-500 text-amber-300 font-bold text-sm tracking-wide">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    JANGAN LUPA!
                </span>
            </div>
            <div class="text-center mb-8">
                <p id="popup-text" class="text-gray-100 text-lg font-medium leading-normal">
                    Harap isi Link GForm dan Token Masuk terlebih dahulu!
                </p>
            </div>
            <div class="flex justify-center">
                <button onclick="closeCustomPopup()" class="px-10 py-3 bg-amber-500 hover:bg-amber-400 rounded-full text-gray-950 font-bold transition duration-150 transform hover:scale-105 active:scale-95 shadow-md">
                    Oke, Saya Paham
                </button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode;
        let currentFacingMode = "environment"; // Default kamera belakang

        function showCustomPopup(message) {
            if(message) {
                document.getElementById('popup-text').innerText = message;
            }
            document.getElementById('customPopupOverlay').classList.remove('hidden');
        }

        function closeCustomPopup() {
            document.getElementById('customPopupOverlay').classList.add('hidden');
        }

        function checkFieldsAndProceed() {
            const gformInput = document.getElementById('gformUrl').value;
            const tokenInput = document.getElementById('examToken').value;

            if (!gformInput.trim() || !tokenInput.trim()) {
                showCustomPopup("Harap isi Link GForm dan Token Masuk terlebih dahulu!");
            } else {
                alert("Proses login ujian dimulai...");
            }
        }

        // ================= ENGINE SCANNER & SWITCH KAMERA =================
        function openScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            
            // Inisialisasi instance QR Code baru jika belum ada
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            startCamera(currentFacingMode);
        }

        function startCamera(facingMode) {
            const config = { fps: 10, qrbox: { width: 220, height: 220 } };
            
            // Hentikan kamera yang sedang berjalan sebelum berpindah mode kamera
            html5QrCode.start({ facingMode: facingMode }, config, onScanSuccess)
            .catch(err => {
                console.error("Gagal membuka kamera: ", err);
                showCustomPopup("Gagal membuka jenis kamera ini. Coba beralih ke pilihan kamera lainnya.");
            });
        }

        function switchCamera(mode) {
            currentFacingMode = mode;
            
            // Ubah gaya visual tombol aktif
            const btnBack = document.getElementById('btn-cam-back');
            const btnFront = document.getElementById('btn-cam-front');
            
            if (mode === 'environment') {
                btnBack.className = "flex-1 py-2 px-3 bg-blue-600 text-xs font-bold text-white rounded-lg transition active:scale-95 flex items-center justify-center gap-1";
                btnFront.className = "flex-1 py-2 px-3 bg-gray-800 text-xs font-semibold text-gray-300 rounded-lg transition active:scale-95 flex items-center justify-center gap-1";
            } else {
                btnBack.className = "flex-1 py-2 px-3 bg-gray-800 text-xs font-semibold text-gray-300 rounded-lg transition active:scale-95 flex items-center justify-center gap-1";
                btnFront.className = "flex-1 py-2 px-3 bg-blue-600 text-xs font-bold text-white rounded-lg transition active:scale-95 flex items-center justify-center gap-1";
            }

            // Jika kamera aktif, matikan lalu nyalakan ulang dengan mode baru
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    startCamera(currentFacingMode);
                }).catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Masukkan hasil teks QR langsung ke form Link Gform
            document.getElementById('gformUrl').value = decodedText;
            closeScanner();
        }

        function closeScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                }).catch(err => console.error(err));
            } else {
                document.getElementById('scanner-container').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
